[project]
name = "kc-house-infra"
version = "0.1.0"
description = "AWS CDK app that deploys the King County estimator to Lambda."
requires-python = ">=3.13.17"
dependencies = [
    "aws-cdk-lib>=2.275.0",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false
required-version = ">=0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
