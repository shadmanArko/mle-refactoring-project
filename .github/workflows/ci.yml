name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres, so the database tests that SQLite cannot cover run on every PR.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: houses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d houses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KC_TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/houses_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest

  notebook:
    # Executes the refactored notebook end to end and checks its numbers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KC_RUN_NOTEBOOK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest tests/test_notebook.py

  infra:
    # Checks the AWS template's security properties. Nothing is deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install infrastructure dependencies
        working-directory: infra
        run: uv sync --locked
      - name: Test the template
        working-directory: infra
        run: uv run pytest

  stack:
    # Builds the image (which trains the model) and tests the real Compose stack.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Create a throwaway .env
        run: |
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=houses"
            echo "KC_API_KEY=$(openssl rand -hex 16)"
          } > .env
      - name: Build and start the stack
        run: docker compose up --build --wait
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Smoke test, including create/read/delete
        run: |
          python3 scripts/smoke_test.py http://127.0.0.1:8000 \
            --api-key "$(grep '^KC_API_KEY=' .env | cut -d= -f2)"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
