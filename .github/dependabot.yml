version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project pins Python 3.13 (requires-python <3.14); move it deliberately.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
