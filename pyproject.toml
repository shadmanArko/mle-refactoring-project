[project]
name = "mle-refactoring-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "skops>=0.14.0",
]

[project.scripts]
kc-train = "kc_house.train:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
notebook = [
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"
# The notebook libraries are not runtime dependencies: the API image skips them.
default-groups = ["dev", "notebook"]
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]

[tool.uv.build-backend]
module-name = "kc_house"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["King-County.ipynb", "bonus_solution"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "PD", "NPY", "RUF"]
# `X` / `X_train` are the scikit-learn convention for feature matrices.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PD901"]
"scripts/**" = ["S102"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
